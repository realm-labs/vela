name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 */5 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock', 'examples/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check imports
        run: |
          if grep -RInE '(super::){2,}|super[[:space:]]*::[[:space:]]*super' crates examples tests --include='*.rs'; then
            echo "Rust import paths may not contain more than one super segment."
            exit 1
          fi

      - name: Check bytecode source boundary
        run: |
          if grep -RIn 'vela_syntax' crates/vela_bytecode --include='*.rs' --include='Cargo.toml'; then
            echo "vela_bytecode must not depend on or reference vela_syntax."
            exit 1
          fi
          if grep -RInE 'compile_(function|program|module)_source|parse_semantic_(source|modules)|SemanticSource|SemanticModules' crates examples tests --include='*.rs'; then
            echo "Deleted bytecode source compiler APIs must not return."
            exit 1
          fi
          if grep -RIn 'ProgramCompilationMode' crates --include='*.rs'; then
            echo "Raw graph/module compiler request modes must not return."
            exit 1
          fi
          if find crates/vela_hot_reload/src -path '*/tests/*' -prune -o -name '*.rs' -print0 | xargs -0 grep -nE 'build_source_set|ModuleSource|HirSourceSet|CompiledProgram|pub fn compile_(initial|update)'; then
            echo "vela_hot_reload production code must begin at LinkedArtifact."
            exit 1
          fi

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run examples Clippy
        run: cargo clippy --manifest-path examples/Cargo.toml --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace

      - name: Run examples tests
        run: cargo test --manifest-path examples/Cargo.toml

  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        run: |
          rustup toolchain install nightly --profile minimal
          rustup default nightly

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
            fuzz/target/
          key: ${{ runner.os }}-fuzz-${{ hashFiles('Cargo.lock', 'fuzz/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-fuzz-

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Run parser fuzz
        run: cargo fuzz run parser -- -max_total_time=300
