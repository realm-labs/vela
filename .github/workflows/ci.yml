name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 */5 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock', 'examples/Cargo.lock', 'fuzz/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check imports
        run: |
          if grep -RInE '(super::){2,}|super[[:space:]]*::[[:space:]]*super' crates examples tests --include='*.rs'; then
            echo "Rust import paths may not contain more than one super segment."
            exit 1
          fi
          # Handwritten source must use real module boundaries. Pulling build
          # script output in from OUT_DIR is the documented exception and the
          # published way to consume generated Rust bindings, so it is allowed.
          if grep -RIn 'include!' crates examples tests --include='*.rs' \
            | grep -v 'include!(concat!(env!("OUT_DIR")'; then
            echo "Handwritten Rust source must use real module boundaries, not include!."
            echo "Only include!(concat!(env!(\"OUT_DIR\"), ...)) for generated code is allowed."
            exit 1
          fi

      - name: Check bytecode source boundary
        run: |
          if grep -RIn 'vela_syntax' crates/vela_bytecode --include='*.rs' --include='Cargo.toml'; then
            echo "vela_bytecode must not depend on or reference vela_syntax."
            exit 1
          fi
          if grep -RInE 'compile_(function|program|module)_source|parse_semantic_(source|modules)|SemanticSource|SemanticModules' crates/vela_bytecode --include='*.rs'; then
            echo "Deleted bytecode source compiler APIs must not return."
            exit 1
          fi
          if grep -RInE 'ProgramCompilationMode|ProgramCompilationKind' crates --include='*.rs'; then
            echo "Caller-owned bytecode compilation modes must not return."
            exit 1
          fi
          if grep -RInE 'pub[[:space:]]+fn[[:space:]]+build_source_set' crates --include='*.rs'; then
            echo "Generic public HIR source-set construction must not return."
            exit 1
          fi
          if find crates/vela_hot_reload/src -path '*/tests/*' -prune -o -name '*.rs' -print0 | xargs -0 grep -nE 'build_source_set|ModuleSource|HirSourceSet|CompiledProgram|pub fn compile_(initial|update)'; then
            echo "vela_hot_reload production code must begin at LinkedArtifact."
            exit 1
          fi

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run examples Clippy
        run: cargo clippy --manifest-path examples/Cargo.toml --all-targets --all-features --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-features --locked --no-fail-fast

      - name: Run examples tests
        run: cargo test --manifest-path examples/Cargo.toml --all-features --locked --no-fail-fast

      - name: Build Rust documentation
        run: cargo doc --workspace --all-features --locked --no-deps

      - name: Run retained examples
        run: |
          cargo run --manifest-path examples/Cargo.toml --locked --bin bad_schema_duplicate_field
          cargo run --manifest-path examples/Cargo.toml --locked --bin container_type_hints
          cargo run --manifest-path examples/Cargo.toml --locked --bin generic_type_hint_denied
          cargo run --manifest-path examples/Cargo.toml --locked --bin hot_reload_function_swap
          cargo run --manifest-path examples/Cargo.toml --locked --bin hot_reload_function_swap_invalid
          cargo run --manifest-path examples/Cargo.toml --locked --bin io_stdlib
          cargo run --manifest-path examples/Cargo.toml --locked --bin modules
          cargo run --manifest-path examples/Cargo.toml --locked --bin native_function
          cargo run --manifest-path examples/Cargo.toml --locked --bin package_dependency_demo
          cargo run --manifest-path examples/Cargo.toml --locked --bin random_permission_denied
          cargo run --manifest-path examples/Cargo.toml --locked --bin reflect_schema_mutation_denied
          cargo run --manifest-path examples/Cargo.toml --locked --bin reflect_unknown_field_denied
          cargo run --manifest-path examples/Cargo.toml --locked --bin script_state
          cargo run --manifest-path examples/Cargo.toml --locked --bin serde_value

      - name: Check fuzz targets
        run: cargo check --manifest-path fuzz/Cargo.toml --bins --all-features --locked

  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        run: |
          rustup toolchain install nightly --profile minimal
          rustup default nightly

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
            fuzz/target/
          key: ${{ runner.os }}-fuzz-${{ hashFiles('Cargo.lock', 'fuzz/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-fuzz-

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Run parser fuzz
        run: cargo fuzz run parser -- -max_total_time=300

      - name: Run portable plan fuzz
        run: cargo fuzz run portable_plan -- -max_total_time=300
