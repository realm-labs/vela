[package]
name = "vela_examples"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
vela_bytecode = { path = "../crates/vela_bytecode" }
vela_common = { path = "../crates/vela_common" }

vela_engine = { path = "../crates/vela_engine", features = ["serde"] }
vela_hot_reload = { path = "../crates/vela_hot_reload" }
vela_macros = { path = "../crates/vela_macros" }
vela_package = { path = "../crates/vela_package" }
vela_reflect = { path = "../crates/vela_reflect" }
vela_vm = { path = "../crates/vela_vm" }

[dev-dependencies]
rstest = { version = "0.28.0", default-features = false }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev-debug]
inherits = "dev"
debug = "full"

[profile.dev-debug.package."*"]
debug = "full"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
