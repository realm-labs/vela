[package]
name = "vela_engine"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
arc-swap = { workspace = true }
blake3 = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true, optional = true }
smallvec = { workspace = true }
vela_bytecode = { workspace = true }
vela_analysis = { workspace = true }
vela_common = { workspace = true }

vela_def = { workspace = true }
vela_hir = { workspace = true }
vela_mir = { workspace = true }
vela_package = { workspace = true }
vela_hot_reload = { workspace = true }
vela_host = { workspace = true }
vela_registry = { workspace = true }
vela_reflect = { workspace = true }
vela_stdlib = { workspace = true }
vela_vm = { workspace = true }

[features]
serde = ["dep:serde", "vela_vm/serde"]

[dev-dependencies]
stats_alloc = "0.1"
vela_bytecode = { workspace = true, features = ["test-support"] }
vela_macros = { workspace = true }
vela_language_service = { workspace = true }

[[bench]]
name = "hot_reload"
harness = false

[[bench]]
name = "generation_memory"
harness = false

[[bench]]
name = "actor_memory"
harness = false

[[bench]]
name = "actor_concurrency"
harness = false

[[bench]]
name = "async_execution"
harness = false

[[bench]]
name = "interop"
harness = false

[[bench]]
name = "service_boundary_baseline"
harness = false

[lints]
workspace = true
