[package]
name = "vela_vm"
version.workspace = true
edition.workspace = true
license.workspace = true
autotests = false

[dependencies]
hashbrown = { workspace = true }
serde = { workspace = true, optional = true }
vela_bytecode = { workspace = true }
vela_common = { workspace = true }

vela_def = { workspace = true }
vela_host = { workspace = true }
vela_mir = { workspace = true }
vela_reflect = { workspace = true }
vela_stdlib = { workspace = true }
vela_stdlib_runtime = { workspace = true }

[features]
serde = ["dep:serde"]

[dev-dependencies]
vela_bytecode = { workspace = true, features = ["test-support"] }
mlua = { version = "0.11.4", features = ["lua54", "vendored"] }
rhai = "1.25.1"
serde_json = { workspace = true }
vela_hir = { workspace = true }
vela_package = { workspace = true }
vela_registry = { workspace = true }

[[test]]
name = "integration"
path = "tests/integration.rs"

[[test]]
name = "conformance"
path = "tests/conformance.rs"

[[test]]
name = "baseline_workload_contract"
path = "tests/baseline_workload_contract.rs"

[[bench]]
name = "baseline"
harness = false

[[bench]]
name = "external_compare"
harness = false

[lints]
workspace = true
